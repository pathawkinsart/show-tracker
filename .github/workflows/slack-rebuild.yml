# Show Tracker — rebuild from Slack on every new channel post.
#
# Triggered by the Cloudflare Worker (repository_dispatch from Slack
# Events API, or from the tracker page's one-tap Update button via
# POST /update), or manually from the Actions tab.
#
# TWO MODES (Nov 24 — the workspace admin refused the Slack app
# install, so there is no bot token and never will be):
#   * WITH a token (SLACK_BOT_TOKEN set): fetch both channels fresh
#     with slack_fetch.py, then rebuild. The fetched slack-data/ is
#     committed too, so the repo copy stays fresh.
#   * WITHOUT a token (normal now): skip the fetch and rebuild from
#     the slack-data/ committed in this repo. The VM browser-read
#     cron (tracker-update-requests, every 15 min) keeps slack-data/
#     fresh by reading both channels in the cloud browser with
#     Patrick's own signed-in session — no app, no token, no admin.
#     The rebuild never fails for a missing token or missing data:
#     if slack-data/ is absent it logs and exits cleanly.
#
# DATA INVARIANT (do not break it): slack-data/ only ever grows
# FORWARD. The VM cron merges each new read into the 8-day rolling
# window and never adds older posts after the fact. The rebuild
# derives each show's original total as pkgs + shipped-from-the-
# data, which is only correct while the window grows forward. If
# older posts are ever backfilled into slack-data/, delete the
# stored total/shipped fields from show-tracker-data.json first
# (or let the next folder rebuild regenerate the file) so the
# totals are re-derived from the complete data.
#
# The packed-post parser (slack_packed.py) is vendored in vendor/ so
# this repo is self-contained — no checkout of the private shared repo.
# Snapshot totals are optional: without --snapshot-dir the rebuild
# falls back to pkgs + shipped for original totals (TikTok is never
# in a snapshot anyway).
#
# Concurrency: runs are serialized, never cancelled — if the Update
# button is tapped on many channels at once, the dispatches queue
# up and run one at a time instead of racing the same push.
# The VM crons also push show-tracker-data.json, so the commit step
# pulls (rebase) before pushing and retries once on a race.
name: slack-rebuild

on:
  repository_dispatch:
    types: [slack-channel-update]
  workflow_dispatch:

concurrency:
  group: slack-rebuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out show-tracker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch both Slack channels (or skip without a token)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "No SLACK_BOT_TOKEN — skipping fetch; rebuilding from repo slack-data/ (kept fresh by the VM browser-read cron)."
            exit 0
          fi
          python3 slack_fetch.py --out-dir slack-data --days 8

      - name: Rebuild tracker data from Slack
        run: |
          if [ ! -f slack-data/ops.json ] && [ ! -f slack-data/packed.json ]; then
            echo "No Slack data in repo (slack-data/ missing) — nothing to rebuild from. Skipping."
            exit 0
          fi
          python3 slack_rebuild.py \
            --data-dir slack-data \
            --in show-tracker-data.json \
            --out show-tracker-data.json \
            --slack-parser-dir vendor

      - name: Validate the rebuilt JSON
        run: |
          python3 - <<'EOF'
          import json, sys
          d = json.load(open('show-tracker-data.json'))
          shows = d.get('shows')
          assert isinstance(shows, list) and 1 <= len(shows) <= 200, \
              f"bad show count: {len(shows) if isinstance(shows, list) else shows!r}"
          assert d.get('slaRules'), "slaRules missing"
          for s in shows:
              assert s.get('date') and s.get('end') and s.get('platform'), \
                  f"show missing date/end/platform: {s!r}"
              p = s.get('pkgs')
              assert p is None or (isinstance(p, int) and p >= 0), \
                  f"bad pkgs {p!r} on {s!r}"
          known = sum(s['pkgs'] for s in shows if s['pkgs'] is not None)
          print(f"VALID: {len(shows)} shows / {known} known pkgs, "
                f"generatedAt {d.get('generatedAt')}")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "show-tracker-slack"
          git config user.email "show-tracker-slack@users.noreply.github.com"
          git add show-tracker-data.json
          [ -d slack-data ] && git add slack-data
          if git diff --cached --quiet; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git commit -m "Slack push: rebuild in-house from #breaking-ops + #breaking-shipping-updates (event ${{ github.event.client_payload.event_id }}, channel ${{ github.event.client_payload.channel_id }})"
          # The VM crons also push this repo; rebase onto their push if any.
          git pull --rebase || { git rebase --abort; echo "Concurrent update won — skipping push; next run picks it up."; exit 0; }
          git push || { git pull --rebase && git push; }
